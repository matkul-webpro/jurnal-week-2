<!DOCTYPE html>
<html>
<head>
    <title>Latihan Tabel</title>
</head>
<body>
    <table border="1" bordercolor="white">
        <tr height="80">
            <td rowspan="7" width="80" bgcolor="blue"></td>
            <td colspan="3" width="240" bgcolor="blue"></td>
        </tr>

        <tr height="80">
            <td width="80" bgcolor="lime"></td>
            <td rowspan="2" colspan="2" width="160" bgcolor="lime"></td>
            <td rowspan="2" width="80" bgcolor="blue"></td>
        </tr>

        <tr height="80">
            <td></td>
        </tr>

        <tr height="80">
            <td bgcolor="blue"></td>
            <td></td>
            <td bgcolor="blue"></td>
        </tr>

        <tr height="80">
            <td colspan="4"></td>
        </tr>

        <tr height="80">
            <td colspan="4"></td>
        </tr>

        <tr height="80">
            <td colspan="4"></td>
        </tr>
    </table>

</body>
</html>
